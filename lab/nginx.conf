limit_req_zone $binary_remote_addr zone=openshare_recipient:10m rate=50r/s;

server {
    listen 8443 ssl;
    server_name share.lab;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    limit_req zone=openshare_recipient burst=100 nodelay;
    limit_req_status 429;
    location ~ "^/open-sharing/shares/[^/]+/schemas/[^/]+/tables/[^/]+/query$" {
        if ($request_method != POST) { return 405; }
        proxy_pass http://sharing:9000;
    }
    location ~ "^/open-sharing/shares/[^/]+/schemas/[^/]+/tables/[^/]+$" {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        proxy_pass http://sharing:9000;
    }
    location ~ "^/open-sharing/shares(/[^/]+(/(all-tables|schemas(/[^/]+/tables(/[^/]+/(metadata|version))?)?))?)?$" {
        if ($request_method != GET) { return 405; }
        proxy_pass http://sharing:9000;
    }
    location ~ "^/open-sharing/files/[a-f0-9]{32}/[a-f0-9]{32}/[0-9]+/[a-f0-9]{64}$" {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        proxy_pass http://sharing:9000;
    }
    location / {
        return 404;
    }
}
