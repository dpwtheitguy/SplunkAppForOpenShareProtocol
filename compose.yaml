services:
  splunk:
    image: ${SPLUNK_IMAGE:-splunk/splunk:10.6.1}
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Run lab/setup.sh first}
      PUBLISHER_PASSWORD: ${PUBLISHER_PASSWORD:?Run lab/setup.sh first}
    ports:
      - "127.0.0.1:${SPLUNK_WEB_PORT:-8000}:8000"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
      - ./lab:/mnt/openshare-lab:ro
      - ./.lab/app-key:/run/openshare/app-key:ro
      - audit:/var/lib/openshare-audit:ro
    networks: [private]
  sharing:
    build: ./service
    environment:
      OPENSHARE_KEY: ${OPENSHARE_KEY:?Run lab/setup.sh first}
      FILE_KEY: ${FILE_KEY:?Run lab/setup.sh first}
      ENDPOINT: https://share.lab:8443/open-sharing
    volumes:
      - shares:/data
      - audit:/audit
    networks: [private]
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.lab/tls:/tls:ro
    ports:
      - "127.0.0.1:${SHARING_HOST_PORT:-8443}:8443"
    networks:
      private:
      recipient:
        aliases: [share.lab]
  recipient:
    build:
      context: ./lab
      dockerfile: Recipient.Dockerfile
    profiles: [test]
    environment:
      REQUESTS_CA_BUNDLE: /tls/ca.crt
      SSL_CERT_FILE: /tls/ca.crt
    volumes:
      - ./.lab/tls/ca.crt:/tls/ca.crt:ro
      - ${RECIPIENT_DIR:-./.lab/recipient}:/recipient:ro
      - ./lab/consume.py:/consume.py:ro
    networks: [recipient]
networks:
  private:
  recipient:
    internal: true
volumes:
  splunk-var:
  splunk-etc:
  shares:
  audit:
